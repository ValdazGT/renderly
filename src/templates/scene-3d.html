<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>renderly 3d scene</title>
		<script src="/node_modules/gsap/dist/gsap.min.js"></script>
		<script src="/src/render/kit/rl-kit.js"></script>
		<script src="/src/render/kit/rl-3d.js"></script>
	</head>
	<body>
		<script>
			RL.init();

			const view = RL.scene3d({
				fov: 52,
				position: [0, 2.1, 7.2],
				target: [0, -0.2, 0],
				lightDir: [-0.4, 0.85, 0.45],
				fogNear: 8,
				fogFar: 24,
				fogColor: '#070B16',
			});

			const sea = view.mesh({
				geometry: 'plane',
				width: 16,
				height: 22,
				segments: [46, 60],
				color: RL.theme.accent,
				wireframe: true,
				lineWidth: 1.6,
				opacity: 0.85,
				amp: 1.1,
				frequency: 0.55,
				speed: 1.15,
				rotation: [-0.18, 0, 0],
				position: [0, -1.4, 0],
			});

			const orb = view.mesh({
				geometry: 'icosa',
				detail: 1,
				radius: 1.15,
				color: RL.theme.accent2,
				position: [0, 0.6, 0],
				rotationSpeed: [0.35, 0.55, 0],
				opacity: 0.9,
			});

			const halo = view.lines({
				points: Array.from({ length: 72 }, (_, i) => {
					const a = (i / 72) * Math.PI * 2;

					return [Math.cos(a) * 2.1, 0.6, Math.sin(a) * 2.1];
				}),
				closed: true,
				color: RL.theme.accent,
				width: 2,
				opacity: 0.55,
			});

			view.onUpdate(t => {
				halo.rotation = [0, t * 0.25, 0];
				orb.position = [Math.sin(t * 0.6) * 0.3, 0.6 + Math.sin(t * 0.9) * 0.18, Math.cos(t * 0.6) * 0.3];
			});

			RL.fx.vignette(0.6);
			RL.fx.grain(0.06);

			const chip = RL.chip({ text: 'FISIKA OMBAK', y: 300 });

			RL.reveal(chip, 0.05, { y: 30 });

			const head = RL.text({ text: 'ENERGI DARI LAUT', y: 420, size: 104, uppercase: true });

			RL.stagger(RL.split(head), 0.25, { y: 70, stagger: 0.08 });

			const note = RL.text({
				text: 'gelombang memindahkan energi, bukan air',
				y: 1120,
				size: 42,
				weight: 500,
				font: 'text',
				color: RL.theme.muted,
			});

			RL.reveal(note, 1.4, { y: 40 });

			RL.finish();
		</script>
	</body>
</html>
