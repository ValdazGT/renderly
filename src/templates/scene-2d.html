<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>renderly 2d scene</title>
		<script src="/node_modules/gsap/dist/gsap.min.js"></script>
		<script src="/src/render/kit/rl-kit.js"></script>
	</head>
	<body>
		<script>
			RL.init();

			RL.fx.blobs({ count: 3, seed: 11, opacity: 0.16 });
			RL.fx.vignette(0.5);
			RL.fx.grain(0.07);

			const chip = RL.chip({ text: 'SAINS LAUT', y: 300 });

			RL.reveal(chip, 0.05, { y: 30, dur: 0.55 });

			const head = RL.text({ text: 'APA ITU OMBAK?', y: 540, size: 126, uppercase: true, lineHeight: 1.04 });
			const headWords = RL.split(head);

			RL.stagger(headWords, 0.2, { y: 80, stagger: 0.09 });
			RL.anim(head, { scale: 1.02, duration: 3, ease: 'sine.inOut' }, 1.4);

			const underline = RL.shape({ type: 'pill', w: 230, h: 10, x: 425, y: 720, fill: RL.theme.accent });

			RL.fromTo(underline, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0.85);

			const stat = RL.stat({ value: '±10 m', label: 'tinggi ombak bisa setara gedung 3 lantai', y: 960, size: 150 });

			RL.reveal(stat.value, 1.3, { y: 60 });
			RL.reveal(stat.label, 1.55, { y: 40 });

			const bar = RL.bar({ y: 1320, w: 720, x: 180, value: 0, track: 'rgba(255,255,255,.12)' });

			RL.fromTo(bar.fill, { width: '0%' }, { width: '72%', duration: 2.2, ease: 'power2.out' }, 1.6);

			RL.finish();
		</script>
	</body>
</html>
